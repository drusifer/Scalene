name: Publish to PyPI

# Triggered when a version tag (vX.Y.Z) is pushed — must match pyproject.toml
# [project].version. Authentication uses PyPI OIDC Trusted Publishing for the
# `drew.gs.works` account — no PyPI API token is stored.
# Setup details: docs/SDLC.md section 7 & 8.
on:
  push:
    tags: ["v*"]

# Least privilege: jobs get read-only contents unless elevated explicitly.
permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Verify release tag matches pyproject.toml version
        run: make release-check TAG="${{ github.ref_name }}"

      - name: Install build and check tools
        run: make install

      - name: Build and verify sdist + wheel
        run: make build && make check-dist

      - name: Upload built distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish scalene-guard to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
